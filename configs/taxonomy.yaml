# ============================================================================
# taxonomy.yaml — the single source of truth for catalogue vocabulary.
#
# WHY THIS FILE EXISTS
# Every merge decision below was made by inspecting the raw catalogue
# (56,280 rows). Hard-coding these maps inside a Python script would hide
# them from review; here a supervisor can audit every judgement call and
# a reviewer can diff changes across commits.
# ============================================================================

# ---------------------------------------------------------------------------
# 1. CATEGORY MERGES  — 24 raw values collapse to 14 canonical ones.
#    Rationale: category is BOTH a user-facing filter and a similarity
#    feature. Near-duplicate labels split the candidate pool and silently
#    halve recall for the affected categories.
# ---------------------------------------------------------------------------
category_map:
  "Gaming & Tech":         "Gaming & Technology"
  "Gaming":                "Gaming & Technology"
  "Technology & Gadgets":  "Gaming & Technology"

  "Jewelry & Watches":     "Jewellery & Watches"
  "Jewellery":             "Jewellery & Watches"
  "Watches & Accessories": "Jewellery & Watches"

  "Beauty & Self-Care":    "Beauty & Self-Care"
  "Beauty & Skincare":     "Beauty & Self-Care"
  "Perfume & Fragrance":   "Beauty & Self-Care"

  "Toys & Games":          "Toys & Games"
  "Toys & Kids":           "Toys & Games"

  "Fashion & Accessories": "Fashion & Accessories"
  "Fashion":               "Fashion & Accessories"

  "Home & Décor":          "Home & Living"
  "Arts & Crafts":         "Arts & Crafts"
  "Sports & Fitness":      "Sports & Fitness"
  "Books & Learning":      "Books & Learning"
  "Office & Study":        "Office & Study"
  "Food & Sweets":         "Food & Sweets"
  "Flowers & Plants":      "Flowers & Plants"
  "Baby & Parenting":      "Baby & Parenting"
  "Religious":             "General Gifts"   # only 44 rows; too thin to stand alone
  "General Gifts":         "General Gifts"
  "Music":                 "Books & Learning"

# ---------------------------------------------------------------------------
# 2. GIFT TYPE MERGES — 15 raw values -> 9.
# ---------------------------------------------------------------------------
gift_type_map:
  "Digital Game":            "Gaming"
  "Gaming Gift":             "Gaming"
  "Sports & Fitness Gift":   "Sports & Fitness"
  "Sports Equipment":        "Sports & Fitness"
  "Sportswear":              "Sports & Fitness"
  "Toy / Entertainment":     "Toy"
  "Beauty / Self-Care Gift": "Beauty"
  "Edible Gift":             "Edible"
  "Floral Gift":             "Floral"
  "Home Gift":               "Home"
  "Gift Set / Bundle":       "Gift Set"
  "Gift Card / Voucher":     "Voucher"
  "Personalized Gift":       "Personalised"
  "Fashion Accessory":       "Fashion Accessory"
  "Single Product":          "Single Product"

# ---------------------------------------------------------------------------
# 3. AGE RANGES — the string label maps to a numeric [min, max] interval.
#    Numeric bounds let us HARD-FILTER on the user's stated age instead of
#    string-matching a bucket. min_age is a safety floor, never relaxed.
# ---------------------------------------------------------------------------
age_ranges:
  "Baby only":    {min: 0,  max: 3}
  "Baby–Child":   {min: 0,  max: 12}
  "Child only":   {min: 4,  max: 12}
  "Child–Teen":   {min: 4,  max: 17}
  "Teen–Adult":   {min: 13, max: 99}
  "Adult only":   {min: 18, max: 99}
  "All Ages":     {min: 0,  max: 99}

# ---------------------------------------------------------------------------
# 4. HARD SAFETY OVERRIDES
#    Steam titles carry no PEGI/ESRB rating in our source. Rather than ship a
#    catalogue that can surface violent titles to a child query under filter
#    relaxation, we floor the entire source at 13+. Conservative by design.
#    See docs/decisions/0004-content-safety-floor.md
# ---------------------------------------------------------------------------
safety_floors:
  by_source_site:
    Steam: 13

# Rows dropped outright at ingest.
drop_rules:
  # 417 free-to-play Steam titles. A free item is not a gift.
  - {column: "Price (SAR)", op: "le", value: 0}

# ---------------------------------------------------------------------------
# 5. OCCASION RULES — inclusion logic, not selection logic.
#    An occasion is a SOCIAL context, not a product category. Eid does not
#    have "Eid products"; it has products that are culturally appropriate to
#    give at Eid. The raw catalogue tagged only 400 rows Religious because it
#    matched on category name. These rules restore realistic coverage.
#    THIS FILE IS A HEURISTIC BASELINE — accuracy is measured against the
#    300-row human-labelled gold set in data/annotations/.
# ---------------------------------------------------------------------------
occasion_rules:
  Birthday:
    include_categories: ["*"]              # genuinely universal
    exclude_categories: ["Baby & Parenting"]   # a baby gift is not a birthday gift
    exclude_gift_types: ["Floral"]         # flowers alone read as a weak gift

  Graduation:
    include_categories:
      ["Jewellery & Watches", "Gaming & Technology", "Office & Study",
       "Books & Learning", "Fashion & Accessories", "General Gifts"]
    min_age: 16

  Anniversary:
    # Measured precision 0.406. Home goods and sweets are not anniversary
    # gifts between partners; removed. Price floor reflects the social weight
    # of the occasion.
    include_categories:
      ["Jewellery & Watches", "Flowers & Plants", "Beauty & Self-Care"]
    min_age: 18
    min_price: 150

  Wedding:
    # Arts & Crafts was a source of false positives; removed. Price floor
    # reflects that a wedding gift is a substantial one.
    include_categories:
      ["Home & Living", "Jewellery & Watches", "General Gifts"]
    min_age: 18
    min_price: 200

  Eid / Religious:
    # Measured recall was 0.579 against the gold set: the rule missed 40% of
    # genuine Eid gifts. In the Gulf, Eid gifting spans essentially every
    # category and every age. Broadened accordingly.
    include_categories: ["*"]
    exclude_categories: ["Office & Study"]
    # no age floor — Eid gifting spans every age, children especially

  Mother's Day:
    include_categories:
      ["Beauty & Self-Care", "Jewellery & Watches", "Flowers & Plants",
       "Home & Living", "Food & Sweets"]
    gender_target: ["Female", "Unisex"]

  Father's Day:
    # Measured precision was 0.212: the rule fired on a third of the catalogue
    # against a gold rate of 11%. Restricted to categories a father is actually
    # given, with a price floor that excludes trinkets.
    # Second pass: restricting gender_target to Male alone dropped recall to
    # 0.125, since only 12% of the catalogue is labelled Male. Unisex restored,
    # with tighter categories and a price floor carrying the precision instead.
    include_categories:
      ["Sports & Fitness", "Office & Study", "Gaming & Technology",
       "Jewellery & Watches"]
    gender_target: ["Male", "Unisex"]
    min_price: 100
    min_age: 16

  New Baby:
    # First pass restricted to infant products and collapsed to 1%; the
    # correction over-swung to 39% against a gold rate of 14%. Jewellery and
    # beauty were the culprits - removed. Price ceiling added: a new-baby gift
    # is not a luxury purchase.
    include_categories:
      ["Baby & Parenting", "Toys & Games", "Flowers & Plants", "Food & Sweets"]
    max_price: 3000

  Housewarming:
    include_categories: ["Home & Living", "Flowers & Plants"]
    max_price: 3000

  Thank You:
    include_categories:
      ["Flowers & Plants", "Food & Sweets", "Beauty & Self-Care", "General Gifts"]

# NOTE: "General / Any Occasion" is deliberately NOT a rule. It appeared on
# 96.7% of raw rows and therefore carried zero discriminative power. It is
# treated as the ABSENCE of a specific occasion, not as a label.
